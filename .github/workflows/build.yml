

name: Build Inova 1 for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        working-directory: "inova-1-source (1)/inova-1"
        run: npm install

      - name: Crear instalador
        working-directory: "inova-1-source (1)/inova-1"
        run: npm run dist

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Inova-1-Windows-Installer
          path: "inova-1-source (1)/inova-1/dist/*.exe"
          if-no-files-found: error
